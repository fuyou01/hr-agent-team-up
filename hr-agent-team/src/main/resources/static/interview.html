<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 面试官</title><style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#172033}button{padding:8px 14px;margin:4px;border:0;border-radius:6px;background:#2457d6;color:#fff}button:disabled{opacity:.5}textarea,input,select{padding:8px;border:1px solid #ccd3df;border-radius:6px;width:100%;box-sizing:border-box}section{margin:14px 0;padding:16px;border:1px solid #e1e6ef;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;max-height:300px;background:#101522;border-radius:8px}.caption{min-height:90px;background:#f5f7fb;padding:10px;border-radius:8px}.muted{color:#667085;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>AI 面试官</h1><p class="muted">AI 只通过字幕提问；摄像头信号仅用于技术状态记录和人工复核，不用于招聘评分。</p>
<section><h2>初始化</h2><div class="grid"><label>候选人 JSON<textarea id="candidate">{"candidate_id":"C-1","name":"候选人"}</textarea></label><label>岗位 JSON<textarea id="jd">{"title":"后端工程师","core_challenges":["稳定性","性能"]}</textarea></label></div><label>行业<select id="industry"><option value="computer">计算机（默认）</option><option>sales</option><option>finance</option><option>legal</option><option>manufacturing</option><option>supply_chain</option><option>design</option><option>marketing</option></select></label><button id="create">创建面试</button><span id="session"></span></section>
<section><h2>设备与实时字幕</h2><div class="grid"><div><video id="preview" autoplay muted playsinline></video><p><button id="device">开启摄像头/麦克风</button><button id="start" disabled>开始面试</button><button id="complete" disabled>提交面试</button></p></div><div class="caption"><div><b>AI：</b><span id="aiCaption">等待初始化</span></div><hr><div><b>候选人：</b><span id="candidateCaption">—</span></div><p class="muted" id="notice"></p></div></div></section>
<section><h2>回答与事件</h2><label>当前问题<textarea id="question" placeholder="粘贴或输入 AI 字幕中的问题"></textarea></label><label>候选人回答<textarea id="answer"></textarea></label><button id="sendAnswer" disabled>提交回答字幕</button><button id="sendSignal" disabled>记录技术信号</button><pre id="log"></pre></section>
<script>
let id='',token='',stream=null,ws=null,seq=0,recorder=null,mediaId='media-'+Date.now(),chunkNo=0,recordingStopped=null,pendingUploads=[];
const $=x=>document.getElementById(x), log=x=>{$('log').textContent+=x+'\n'};
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{'X-Interview-Token':token}:{})},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||d.message||('HTTP '+r.status));return d}
$('create').onclick=async()=>{try{const d=await api('/api/interviews','POST',{candidate:JSON.parse($('candidate').value),jd:JSON.parse($('jd').value),industry:$('industry').value});id=d.session_id;token=d.access_token;$('session').textContent='会话 '+id;$('device').disabled=false;log('已创建，会话 token 已保存在当前页内存中')}catch(e){log(e.message)}};
$('device').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('preview').srcObject=stream;await api('/api/interviews/'+id+'/consent','POST',{camera:'granted',microphone:'granted',recording_mode:'temporary'});await api('/api/interviews/'+id+'/prepare','POST');$('start').disabled=false;log('设备授权完成，提示词包已冻结')}catch(e){log(e.message)}};
$('start').onclick=async()=>{try{await api('/api/interviews/'+id+'/start','POST');$('start').disabled=true;$('complete').disabled=false;$('sendAnswer').disabled=false;$('sendSignal').disabled=false;startRecorder();connect();log('面试开始')}catch(e){log(e.message)}};
function startRecorder(){if(!stream||!window.MediaRecorder)return;recorder=new MediaRecorder(stream);recordingStopped=new Promise(resolve=>recorder.onstop=resolve);recorder.ondataavailable=e=>{if(e.data&&e.data.size){const p=uploadChunk(e.data);pendingUploads.push(p);p.finally(()=>pendingUploads=pendingUploads.filter(x=>x!==p))}};recorder.start(5000)}
function bytesToBase64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}
async function uploadChunk(blob){try{const bytes=new Uint8Array(await blob.arrayBuffer()),hash=await crypto.subtle.digest('SHA-256',bytes),hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join(''),base64=bytesToBase64(bytes),now=Date.now();await api('/api/interviews/'+id+'/media/chunks','POST',{media_id:mediaId,chunk_no:chunkNo++,codec:blob.type||'video/webm',start_ms:now,end_ms:now+5000,sha256:hex,data_base64:base64})}catch(e){log('媒体分片上传失败：'+e.message)}}
async function connect(){const t=await api('/api/interviews/'+id+'/live-ticket','POST');ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/interviews/'+id+'/live?ticket='+encodeURIComponent(t.ticket));ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='caption'&&d.source==='agent')$('aiCaption').textContent=d.text};ws.onopen=()=>log('实时通道已连接');ws.onerror=()=>log('实时通道不可用，可继续使用 HTTP 字幕接口')}
$('sendAnswer').onclick=async()=>{const text=$('answer').value.trim(),question=$('question').value.trim();if(!text||!question)return;const event={session_id:id,type:'response',answer_id:'A-'+Date.now(),question,text,final:true,client_event_id:'evt-'+Date.now(),sequence:++seq};try{await api('/api/interviews/'+id+'/responses','POST',event);$('candidateCaption').textContent=text;$('answer').value='';log('回答已记录')}catch(e){log(e.message)}};
$('sendSignal').onclick=async()=>{try{await api('/api/interviews/'+id+'/video-events','POST',{event_name:'tab_hidden',confidence:.5,review_required:true,evidence_ref:'browser:'+Date.now(),severity:'medium',client_event_id:'signal-'+Date.now(),sequence:++seq});$('notice').textContent='技术信号已记录，需人工复核';}catch(e){log(e.message)}};
$('complete').onclick=async()=>{try{if(recorder&&recorder.state!=='inactive'){recorder.stop();await recordingStopped;await Promise.all(pendingUploads);await api('/api/interviews/'+id+'/media/'+mediaId+'/complete','POST')}await api('/api/interviews/'+id+'/complete','POST');if(ws)ws.close();if(stream)stream.getTracks().forEach(t=>t.stop());$('complete').disabled=true;log('面试过程已完整记录，等待评分')}catch(e){log(e.message)}};
</script></body></html>
