spring.datasource.url=${HR_DB_URL:jdbc:h2:file:./data/hr-agent;AUTO_SERVER=TRUE}
spring.datasource.username=${HR_DB_USER:sa}
spring.datasource.password=${HR_DB_PASSWORD:}
# Spring Boot 根据 HR_DB_URL 自动选择驱动；默认 H2，生产可使用 PostgreSQL 驱动。
spring.sql.init.mode=always
spring.h2.console.enabled=${HR_H2_CONSOLE:false}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.jackson.serialization.write-dates-as-timestamps=false
hr.media.retention-days=${HR_MEDIA_RETENTION_DAYS:7}
